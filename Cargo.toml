[workspace]
resolver = "3"
members = [
    "common",
    "handgen",

    "algorithms/dummy",
    "algorithms/decomp",
    "algorithms/decomp_pruned",
    "algorithms/decomp_fixed_pruned",
    "algorithms/decomp_ara",
    "algorithms/decomp_ara_removal",
    "algorithms/decomp_kobayashi",
    "algorithms/pruning_dfs_ymatsux",
    "algorithms/pruning_dfs_ymatsux_improved",
    "algorithms/pruning_dfs_mjai_manue_go",

    "adapters/shanten_dp",
    "adapters/xiangting",
]

[workspace.package]
description = "Shanten Number Calculation Algorithm Collection"
version = "0.1.0"
authors = ["Apricot S."]
edition = "2024"
license = "MIT-0"
readme = "README.md"
repository = "https://github.com/Apricot-S/shanten-algorithm-collection"
keywords = ["mahjong", "riichi", "shanten"]
categories = ["algorithms"]
publish = false

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.dependencies]
common = { path = "common" }
